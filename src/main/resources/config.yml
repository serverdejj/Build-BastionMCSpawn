# El tiempo solo aplica al comando /spawn, no al primer ingreso ni al respawn.
teleport:
  delay-seconds: 5
  cancel-on-move: true
  op-bypass: false

# true: solamente los jugadores que entran POR PRIMERA VEZ aparecen en /spawn.
# false: desactiva el teletransporte automatico al ingresar.
# Los jugadores que regresan siempre conservan su ultima ubicacion.
join:
  teleport-to-spawn: true
