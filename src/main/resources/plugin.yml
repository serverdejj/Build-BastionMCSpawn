name: BastionMCSpawn
version: 1.1.3
main: mc.bastion.spawn.BastionMCSpawn
api-version: '1.21'
author: BASTION MC
description: Spawn configurable con cuenta regresiva, mensajes editables y compatibilidad con nametags.
commands:
  spawn:
    description: Teletransportarse al spawn del servidor.
    usage: /spawn
    permission: bastionmcspawn.spawn
  setspawn:
    description: Establecer el spawn del servidor.
    usage: /setspawn
    permission: bastionmcspawn.admin
  bastionspawn:
    description: Administrar BastionMCSpawn.
    usage: /bastionspawn reload
    permission: bastionmcspawn.admin
permissions:
  bastionmcspawn.spawn:
    description: Usar /spawn.
    default: true
  bastionmcspawn.admin:
    description: Configurar y recargar BastionMCSpawn.
    default: op
